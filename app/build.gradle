plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Supabase project (accounts + sync). supabase.properties is gitignored; without it the build still
// works and the app simply hides sign-in.
def supabasePropertiesFile = rootProject.file('supabase.properties')
def supabaseProperties = new Properties()
if (supabasePropertiesFile.exists()) {
    supabaseProperties.load(new FileInputStream(supabasePropertiesFile))
}

// Firebase (phone notifications). google-services.json from the Firebase console, in the project
// root or app/; gitignored. Read here into BuildConfig rather than through the google-services
// plugin, so a build without it (CI, a fresh clone) still works and just has no notifications.
def firebaseJsonFile = [rootProject.file('google-services.json'), file('google-services.json')].find { it.exists() }
def firebaseConfig = [appId: '', apiKey: '', projectId: '', senderId: '']
if (firebaseJsonFile != null) {
    def json = new groovy.json.JsonSlurper().parse(firebaseJsonFile)
    def client = json.client.find { it.client_info.android_client_info.package_name == 'com.mtgcompanion.app' }
    if (client != null) {
        firebaseConfig = [
            appId: client.client_info.mobilesdk_app_id,
            apiKey: client.api_key[0].current_key,
            projectId: json.project_info.project_id,
            senderId: json.project_info.project_number
        ]
    }
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// The tester build's number, from -PtesterBuild; 0 for every other build.
def testerBuild = (project.findProperty('testerBuild') ?: '0').toString().toInteger()

// The Google Play build: `gradlew bundleRelease -PplayStore=true`. Play forbids an app updating itself
// from anywhere but Play, so this build has the in-app GitHub updater switched off (BuildConfig.PLAY_STORE,
// see update/InstallSource.kt) and drops REQUEST_INSTALL_PACKAGES (src/play/AndroidManifest.xml). The
// GitHub APKs are built without it and are unchanged. Run it as its own Gradle invocation: it changes
// BuildConfig, so the release build's classes are compiled again.
def playStore = (project.findProperty('playStore') ?: 'false').toString().toBoolean()

android {
    namespace 'com.mtgcompanion.app'
    // 36 = Android 16. Play requires a recent targetSdk for new apps and updates (35 since Aug 2025,
    // 36 expected from Aug 2026); the behaviour changes that come with it are handled in code
    // (edge-to-edge and IME insets, predictive back — see MainActivity and MtgNavGraph).
    compileSdk 36

    defaultConfig {
        applicationId 'com.mtgcompanion.app'
        // The launcher label, so a side-by-side debug build is tellable from the real one.
        manifestPlaceholders = [appLabel: '@string/app_name']
        minSdk 26
        targetSdk 36
        // versionCode scheme: major*10000 + minor*100 + patch (e.g. 1.8.0 -> 10800). Bump both per release.
        versionCode 30600
        versionName '3.6.0'
        // Which tester build this is (see the beta build type): `gradlew assembleBeta -PtesterBuild=3`.
        // The tester app updates itself to any tester-N pre-release with a higher number.
        buildConfigField 'int', 'TESTER_BUILD', "${testerBuild}"
        // Built for Google Play (-PplayStore=true): Play does the updating, not the app.
        buildConfigField 'boolean', 'PLAY_STORE', "${playStore}"

        // Bounds which ABIs exist in this project at all, which the `splits` block below then
        // divides into one APK each. It has to stay: the universal APK packages every ABI the
        // project has native libs for, regardless of the splits `include` list, so without this
        // onnxruntime's unused 32-bit x86 libs (~38MB) would land back in it.
        buildConfigField 'String', 'SUPABASE_URL', "\"${supabaseProperties.getProperty('supabaseUrl', '')}\""
        buildConfigField 'String', 'SUPABASE_ANON_KEY', "\"${supabaseProperties.getProperty('supabaseAnonKey', '')}\""
        buildConfigField 'String', 'FIREBASE_APP_ID', "\"${firebaseConfig.appId}\""
        buildConfigField 'String', 'FIREBASE_API_KEY', "\"${firebaseConfig.apiKey}\""
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', "\"${firebaseConfig.projectId}\""
        buildConfigField 'String', 'FIREBASE_SENDER_ID', "\"${firebaseConfig.senderId}\""

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // onnxruntime-android ships a 22-38MB libonnxruntime.so PER ABI, so one universal APK carrying
    // all of them is ~90MB of native code alone. Build a separate APK per ABI instead, so a phone
    // downloads only the one it can actually run. 32-bit x86 is dropped entirely (no real device
    // needs it); x86_64 is kept only so the project's own test emulator still has a build.
    //
    // The universal APK is still built, as an always-installable fallback and because it is what
    // pre-1.69.0 clients' in-app updater picks up: it takes the release's first .apk asset, and
    // GitHub lists assets sorted by NAME, not upload order. So the universal one is published as
    // mtg-companion-universal-vX.Y.Z.apk, which sorts ahead of every mtg-companion-vX.Y.Z-<abi>.apk
    // ("u" < "v") — see UpdateManager and the release workflow.
    //
    // All the split APKs share one versionCode: they're sideloaded from GitHub Releases, not
    // ranked against each other by the Play Store, and Android is happy to install over an equal
    // versionCode, so a user can move between the universal and their ABI's build freely.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // Installs alongside the released app instead of being rejected for a signature clash:
            // same package signed by two different keys can't replace itself. Only the debug variant
            // moves — the release applicationId stays com.mtgcompanion.app, which Play, Google
            // Sign-In and the Drive folder all key off.
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            manifestPlaceholders = [appLabel: 'Manabind debug']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        // What's handed out to try before a release: the release build under a name of its own, so
        // it installs beside the real app rather than over it and is told apart at a glance. Built
        // with `gradlew assembleBeta` and published as a GitHub pre-release, which the in-app
        // updater and manabind.com never offer (they only read the latest full release). Called
        // beta because a build type's name can't start with "test".
        beta {
            initWith release
            applicationIdSuffix '.tester'
            versionNameSuffix "-tester${testerBuild}"
            manifestPlaceholders = [appLabel: 'Manabind Tester']
            matchingFallbacks = ['release']
        }
    }

    if (playStore) {
        // Merged over the main manifest for the release build only: removes the install permission.
        sourceSets.release.manifest.srcFile 'src/play/AndroidManifest.xml'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            // GitHub APKs: store .so compressed in the APK instead of uncompressed-and-page-aligned
            // (AGP's default for minSdk >= 23). libonnxruntime.so is ~32MB raw but ~12MB deflated,
            // and these APKs are sideloaded from GitHub Releases, so download size is what the user
            // actually feels. The trade-off is that the libs are extracted at install time — a
            // little more on-device storage and a slightly slower install — rather than being
            // mapped straight out of the APK. Extracted libs still load on 16 KB-page devices as
            // long as their ELF segments are 16 KB aligned (checked in CI: scripts/check-16kb-alignment.sh).
            //
            // The Google Play bundle (-PplayStore=true) keeps them uncompressed and 16 KB zip-aligned,
            // as Play recommends: Play compresses the download itself and serves each phone only its
            // own ABI, so the size argument above doesn't apply there.
            useLegacyPackaging = !playStore
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Plain JVM unit tests (./gradlew testDebugUnitTest) — sync merge rules, no Android framework needed.
    testImplementation 'junit:junit:4.13.2'
    // The real org.json, for code that reads JSON (Android's is only stubs in unit tests).
    testImplementation 'org.json:json:20240303'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.1'

    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.4'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.11.0'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.1'
    // moshi-kotlin's reflection adapter would otherwise bring kotlin-reflect 1.8, which can't read
    // the metadata Kotlin 2 writes; keep it in step with the compiler.
    implementation 'org.jetbrains.kotlin:kotlin-reflect:2.2.21'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'io.coil-kt:coil-svg:2.6.0'
    implementation 'io.coil-kt:coil-gif:2.6.0'

    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    // Price alerts on wishlist cards are checked in the background.
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // 1.4+: native libs aligned for 16 KB page sizes (Android 15+ devices).
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'

    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // QR codes: reading them (friends, life counter seats, share links) and drawing them.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    // Phone notifications (friend requests, trades) - see data/social/PushNotifications.kt.
    implementation 'com.google.firebase:firebase-messaging:24.0.3'

    // Art-recognition fallback for the scanner: an ImageNet-pretrained MobileNetV2 (downloaded
    // alongside the index, not bundled) run entirely on-device to embed a photographed card's art
    // and match it against a visual-fingerprint index — see data/artrecognition/.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.29.0'

    // Google Sign-In for importing the retired Drive sync's backup; Drive itself is called via REST over the existing OkHttp,
    // avoiding the heavyweight google-api-services-drive client libraries.
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}

name: Tests

# Unit tests on every push and pull request: sync (SyncCoreTest runs the sync scenarios against
# both push functions), merging, and the rest of app/src/test. No secrets needed — without
# supabase.properties and keystore.properties the debug build still compiles.
#
# The relay (supabase/functions/api-relay) is TypeScript, and its cache has checks of its own that
# run under Node against a stubbed Commander Spellbook.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # A failure's own error lines become annotations, readable from the API where the raw log
      # isn't (a cloud session can read annotations but not download logs or artifacts).
      - run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee build.log && exit 0
          grep -E -A15 "^e: |error:|What went wrong|Caused by|FAILED|AssertionError|expected:" build.log | head -80 \
            | while IFS= read -r line; do [ -n "$line" ] && echo "::error::$line"; done
          exit 1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest

  # The Google Play build (release.yml's bundleRelease -PplayStore=true) must not ask to install
  # packages — Play forbids self-updating — while the GitHub release build still must. Checked on the
  # merged manifests, which need no keystore.
  play-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          set -o pipefail
          merged() { find app/build/intermediates -path '*release*' -name AndroidManifest.xml -path '*merged_manifest*' | head -n 1; }
          ./gradlew :app:processReleaseManifest 2>&1 | tail -n 20
          m=$(merged); echo "GitHub build: $m"
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$m" || { echo "::error::The GitHub release build lost REQUEST_INSTALL_PACKAGES"; exit 1; }
          ./gradlew :app:processReleaseManifest -PplayStore=true 2>&1 | tail -n 20
          m=$(merged); echo "Play build: $m"
          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$m"; then echo "::error::The Play build still asks for REQUEST_INSTALL_PACKAGES"; exit 1; fi
          echo "Play manifest OK"

  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 or newer: the test imports the function's TypeScript directly.
          node-version: 22
      - run: node supabase/functions/api-relay/cache.test.mjs
